<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Sign-up Form</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <aside class="hero">
        <div class="logo-band">
            <img src="./aset/rast-logo.png" alt="Rast Project"/>
            <p>
                Your Styling Partner
            </p>
        </div>
        <p class="photo-credit">
            Foto oleh <a href="https://unsplash.com/id/@justinbuisson?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">JUSTIN BUISSON</a> di <a href="https://unsplash.com/id/foto/pria-berbaju-hitam-JU5_bUxr5Rg?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
        </p>
    </aside>
    <main class="content">
        <section class="intro">
            <h1>
                Sign Up
            </h1>
            <p>
                This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.
            </p>
            <p>
                You <em>know</em> you want to.
            </p>
        </section>

        <!-- Sign Up Form -->
        <section class="form-box">
            <h2>
                Let's do this!
            </h2>
            <form class="sign-form" id="signUpForm">
                <div class="form-field">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-field">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-field">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" minlength="8" required>
                </div>
                <div class="form-field">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required>
                </div>
            </form>
        </section>
        <div class="actions">
            <button type="submit" form="signUpForm">
                Sign Up
            </button>
            <p>
                Already have an account? <a href="#">Log in</a>
            </p>
        </div>
    </main>
</body>
</html>
